spring:
  main:
    web-application-type: none
  application:
    name: notification-worker

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enable: true
          max-retries: 3
          initial-interval: 2s
          multiplier: 2

evolution:
  base-url: ${EVOLUTION_BASE_URL:http://localhost:8081}
  api-key: ${EVOLUTION_API_KEY:5Xk__rOR-2We56yP1qd7Kl16W9KpTznKUt7gqPxAoag}
  instance: ${EVOLUTION_INSTANCE:orderflow}