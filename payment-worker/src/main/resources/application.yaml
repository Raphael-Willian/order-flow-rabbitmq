spring:
  application:
    name: payment-worker

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enable: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2